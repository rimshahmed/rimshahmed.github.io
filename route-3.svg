name: Deploy to GitHub Pages

# Run this every time code lands on the main branch.
on:
  push:
    branches: [main]
  # ...and let you trigger it by hand from the Actions tab.
  workflow_dispatch:

# Permissions this workflow needs in order to publish a Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Package the built site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
